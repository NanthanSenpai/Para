name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CI: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java 17
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Upgrade & align to Expo SDK 52
        run: |
          npm install --no-audit --no-fund
          npx expo install expo@^52.0.0 -- --yes
          npx expo install --fix -- --yes
          npm install --no-audit --no-fund

      - name: Generate native Android project
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Bundle JS into Android assets
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          RN_VERSION=$(node -p "require('react-native/package.json').version")
          npm install --no-save --no-audit --no-fund "@react-native/community-cli-plugin@${RN_VERSION}" "@react-native-community/cli"
          mkdir -p android/app/src/main/assets
          ENTRY_FILE="index.js"
          [ -f "$ENTRY_FILE" ] || ENTRY_FILE="node_modules/expo/AppEntry.js"
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file "$ENTRY_FILE" \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build Standalone Release APK
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -Dorg.gradle.java.home="${{ steps.setup-java.outputs.path }}" --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: para-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
